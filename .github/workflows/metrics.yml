name: Metrics
on:
  # Atualiza sozinho todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode manualmente clicando num botão
  workflow_dispatch:
  # Atualiza sempre que você alterar algo no perfil
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: beatrizmustafa
          template: classic
          base: header, activity, community, repositories
          # Configuração que força a ler as linguagens dos SEUS commits
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
